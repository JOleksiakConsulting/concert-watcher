[project]
name = "concert-watcher"
version = "0.1.0"
description = "Self-hosted watcher that e-mails a daily digest of new concerts by your favourite artists"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jan Oleksiak" }]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "pydantic-settings>=2.6.0",
    "rapidfuzz>=3.10.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[project.urls]
Repository = "https://github.com/JOleksiakConsulting/concert-watcher"
Issues = "https://github.com/JOleksiakConsulting/concert-watcher/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in smoke tests against public source websites"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# FastAPI declares dependencies as Depends()/Header() default arguments.
ignore = ["B008"]

[tool.uv]
exclude-newer = "2 weeks"
